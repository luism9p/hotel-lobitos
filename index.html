<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/webp" href="/favicon.webp" />

    <link rel="preload" as="image" href="/logo-surf-lobitos.webp" fetchpriority="high" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      rel="preload"
      as="style"

    />
    <!-- media="print" makes the browser fetch this without treating it as
         render-blocking for screen; the onload swap then applies it for
         real once it's actually in cache — the standard loadCSS async
         pattern. noscript covers the (rare) no-JS case. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500;1,600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500;1,600&display=swap"
